<svg xmlns="http://www.w3.org/2000/svg" width="520" height="60" viewBox="0 0 520 60" style="width:100%;height:100%" role="img" aria-labelledby="title description">
  <title id="title">Hi 👋 I'm Gemini Light / Tianfu Wang</title>
  <desc id="description">The greeting stays fixed. Gemini Light types in blue, then Tianfu Wang types in purple.</desc>
  <style>
    text { font-family: Menlo, Consolas, "Liberation Mono", monospace; font-size: 28px; font-weight: 600; }
    .greeting { fill: #8b949e; }
    .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
    .blue { fill: #2f81f7; }
    .purple { fill: #a371f7; }
    .reduced-motion { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .typewriter { display: none; }
      .reduced-motion { display: inline; }
    }
  </style>
  <defs>
    <clipPath id="gemini-clip">
      <rect x="178" y="0" width="201.6" height="60">
        <animate attributeName="width" values="0.00;201.60;201.60;0.00;0.00;0.00" keyTimes="0.000000;0.127500;0.400000;0.467500;0.500000;1.000000" dur="8s" calcMode="linear" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="tianfu-clip">
      <rect x="178" y="0" width="0" height="60">
        <animate attributeName="width" values="0.00;0.00;184.80;184.80;0.00;0.00" keyTimes="0.000000;0.500000;0.616875;0.900000;0.961875;1.000000" dur="8s" calcMode="linear" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>
  <text class="greeting" x="0" y="41" textLength="162" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Hi <tspan class="emoji">👋</tspan> I'm</text>
  <g class="typewriter">
    <g clip-path="url(#gemini-clip)">
      <text class="blue" x="178" y="41" textLength="201.6" lengthAdjust="spacingAndGlyphs">Gemini Light</text>
    </g>
    <g clip-path="url(#tianfu-clip)">
      <text class="purple" x="178" y="41" textLength="184.8" lengthAdjust="spacingAndGlyphs">Tianfu Wang</text>
    </g>
    <rect x="379.6" y="18" width="2" height="28" rx="1" fill="#8b949e">
      <animate attributeName="x" values="178.00;379.60;379.60;178.00;178.00;362.80;362.80;178.00;178.00" keyTimes="0.000000;0.127500;0.400000;0.467500;0.500000;0.616875;0.900000;0.961875;1.000000" dur="8s" calcMode="linear" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;1;0.2;1" keyTimes="0;0.45;0.7;1" dur="1s" calcMode="linear" repeatCount="indefinite" />
    </rect>
  </g>
  <text class="reduced-motion blue" x="178" y="41" textLength="201.6" lengthAdjust="spacingAndGlyphs">Gemini Light</text>
</svg>
